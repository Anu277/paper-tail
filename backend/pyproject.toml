[project]
name = "research-paper-agent"
version = "0.1.0"
description = "Agentic RAG research assistant over scientific papers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    "langchain-groq>=1.1",
    "langchain-community>=0.4",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.15",
    "pypdf>=6.0",
    "pymupdf>=1.24",
    "arxiv>=4.0",
    "rank-bm25>=0.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "stop-words>=2025.11.4",
]

[tool.uv]
package = false
